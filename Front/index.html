<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="studentForm">

            <!-- Name -->
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <!-- Email -->
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <!-- Course -->
            <input
                type="text"
                id="course"
                placeholder="Enter your course"
                required
            >

            <!-- Terms -->
            <div class="terms-container">

                <input
                    type="checkbox"
                    id="terms"
                >

                <label for="terms">
                    I accept the Terms & Conditions
                </label>

            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                id="submitBtn"
                disabled
            >

                <span id="buttonText">
                    Register
                </span>

                <span
                    id="spinner"
                    class="hidden"
                >
                    ⏳
                </span>

            </button>

        </form>

        <!-- Message -->
        <p id="message"></p>

    </div>

    <!-- JavaScript -->
    <script src="form-handler.js"></script>

</body>
</html>
